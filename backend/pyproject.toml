[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cineara-backend"
version = "0.1.0"
description = "FastAPI backend for Cineara."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Federico Mazzanti" }]
license = "LicenseRef-Cineara-Custom"
license-files = ["LICENSE.md"]
dependencies = [
  "fastapi>=0.139.2,<1.0.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.scripts]
cineara-worker = "cineara.worker:main"
cineara-scheduler = "cineara.scheduler:main"

[dependency-groups]
dev = [
  "alembic>=1.16.0,<2.0.0",
  "httpx>=0.28.1,<1.0.0",
  "mypy>=2.3.0,<3.0.0",
  "pytest>=9.0.0,<10.0.0",
  "ruff>=0.16.1,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cineara"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PT",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true
