name: cineara

services:
  # ===========================================================================
  # Cineara FastAPI backend
  # ===========================================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cineara-backend

    env_file:
      - ./backend/.env

    # -------------------------------------------------------------------------
    # Override hostnames from the local-development .env.
    #
    # Inside Docker:
    #
    #   localhost
    #
    # refers to the backend container itself.
    #
    # Docker Compose service names act as DNS names:
    #
    #   postgres
    #   redis
    # -------------------------------------------------------------------------

    environment:
      CINEARA_POSTGRES_HOST: postgres
      CINEARA_POSTGRES_PORT: "5432"

      CINEARA_REDIS_HOST: redis
      CINEARA_REDIS_PORT: "6379"

      CINEARA_API_HOST: 0.0.0.0
      CINEARA_API_PORT: "8000"

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

    init: true

    networks:
      - cineara-network


  # ===========================================================================
  # PostgreSQL
  # ===========================================================================

  postgres:
    image: postgres:17-alpine

    container_name: cineara-postgres

    environment:
      POSTGRES_DB: cineara
      POSTGRES_USER: cineara
      POSTGRES_PASSWORD: cineara_dev_password

    ports:
      - "5432:5432"

    volumes:
      - cineara-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U cineara -d cineara"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

    networks:
      - cineara-network


  # ===========================================================================
  # Redis
  # ===========================================================================

  redis:
    image: redis:8-alpine

    container_name: cineara-redis

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    ports:
      - "6379:6379"

    volumes:
      - cineara-redis-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

    restart: unless-stopped

    networks:
      - cineara-network


# =============================================================================
# Persistent data
# =============================================================================

volumes:
  cineara-postgres-data:
    name: cineara-postgres-data

  cineara-redis-data:
    name: cineara-redis-data


# =============================================================================
# Internal network
# =============================================================================

networks:
  cineara-network:
    name: cineara-network
    driver: bridge
