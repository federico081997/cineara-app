name: Contract Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "backend/**"
      - "docker-compose.yml"
      - "docs/**"
      - "scripts/validate_phase*.py"
      - ".github/workflows/contract-validation.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "backend/**"
      - "docker-compose.yml"
      - "docs/**"
      - "scripts/validate_phase*.py"
      - ".github/workflows/contract-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Repository and API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Phase 0 and Phase 1 structure
        run: |
          python scripts/validate_phase0.py
          python scripts/validate_phase1.py

      - name: Validate Docker Compose model
        run: docker compose config --quiet

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true

      - name: Install backend
        working-directory: backend
        run: uv sync --all-groups

      - name: Generate and validate OpenAPI document
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          from cineara.main import app

          schema = app.openapi()
          required_paths = {"/", "/health", "/readiness"}
          actual_paths = set(schema.get("paths", {}))
          missing = required_paths - actual_paths
          if missing:
              raise SystemExit(f"OpenAPI paths missing: {sorted(missing)}")

          output = Path(".artifacts/openapi.json")
          output.parent.mkdir(exist_ok=True)
          output.write_text(json.dumps(schema, indent=2, sort_keys=True) + "\n")
          print(f"Validated {len(actual_paths)} OpenAPI paths.")
          PY
